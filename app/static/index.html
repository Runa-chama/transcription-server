<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="音声・動画を文字起こしするサービス">
  <title>文字起こし | transcription.runachama.com</title>
  <link rel="stylesheet" href="/static/custom.css">
</head>
<body>
<header class="ts-header">
  <div class="ts-header__inner">
    <a class="ts-brand" href="/" aria-label="文字起こし ホーム">
      <span class="ts-brand__mark" aria-hidden="true">文</span>
      <span class="ts-brand__text">文字起こし</span>
    </a>
    <span class="ts-header__note">音声・動画からテキストへ</span>
  </div>
</header>

<main class="ts-main">
  <section class="ts-intro" aria-labelledby="pageTitle">
    <h1 id="pageTitle">音声を、読めるテキストに。</h1>
    <p>アップロードするだけで、srt / vtt / txt / json 形式に書き出します。</p>
  </section>

  <div class="ts-workbench">
    <section class="ts-panel ts-panel--form" aria-labelledby="formTitle">
      <header class="ts-panel__head">
        <h2 id="formTitle">ファイルと設定</h2>
      </header>
      <div class="ts-panel__body">
        <div id="dropzone" class="ts-dropzone" tabindex="0" role="button" aria-label="音声または動画ファイルを選択">
          <svg class="ts-dropzone__icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 16V4"></path>
            <path d="m7 9 5-5 5 5"></path>
            <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
          </svg>
          <p class="ts-dropzone__title">ここにファイルをドロップ</p>
          <p class="ts-muted">またはクリックして選択（最大 4 GB）</p>
          <p id="fileInfo" class="ts-fileinfo">ファイルが選択されていません</p>
          <input id="fileInput" type="file" accept=".wav,.mp3,.m4a,.aac,.flac,.ogg,.oga,.opus,.wma,.aiff,.aif,.amr,.mp4,.mkv,.mov,.webm,.avi,.m4v,.mpeg,.mpg,.3gp,.ts,audio/*,video/*" hidden>
        </div>

        <fieldset class="ts-fieldset">
          <legend class="ts-legend">設定</legend>
          <div class="ts-fields">
            <div class="ts-field">
              <label class="ts-label" for="model">モデル</label>
              <span class="ts-select-wrap">
                <select id="model" class="ts-select"></select>
              </span>
            </div>
            <div class="ts-field">
              <label class="ts-label" for="language">言語</label>
              <span class="ts-select-wrap">
                <select id="language" class="ts-select"></select>
              </span>
            </div>
            <div class="ts-field">
              <label class="ts-label" for="task">タスク</label>
              <span class="ts-select-wrap">
                <select id="task" class="ts-select"></select>
              </span>
            </div>
            <div class="ts-field">
              <label class="ts-label" for="beam">ビーム幅</label>
              <span class="ts-select-wrap">
                <select id="beam" class="ts-select">
                  <option value="1">1（高速）</option>
                  <option value="3">3</option>
                  <option value="5">5（高精度）</option>
                </select>
              </span>
            </div>
          </div>
        </fieldset>

        <div class="ts-options">
          <label class="ts-check">
            <input id="vad" type="checkbox" checked>
            <span class="ts-check__text">無音区間をスキップ（VAD）</span>
          </label>
          <label class="ts-check">
            <input id="txtTimestamps" type="checkbox">
            <span class="ts-check__text">TXT にタイムスタンプを含める</span>
          </label>
        </div>

        <div class="ts-field">
          <label class="ts-label" for="prompt">ヒント（任意）</label>
          <input id="prompt" class="ts-input" type="text" maxlength="500" placeholder="人名・専門用語など">
        </div>

        <fieldset class="ts-fieldset">
          <legend class="ts-legend">出力形式</legend>
          <div id="formats" class="ts-formats"></div>
        </fieldset>

        <div class="ts-actions">
          <button id="startBtn" class="ts-button ts-button--primary" type="button" disabled>文字起こしを開始</button>
          <button id="cancelBtn" class="ts-button ts-button--ghost" type="button" hidden>キャンセル</button>
        </div>
      </div>
    </section>

    <section class="ts-panel ts-panel--status" aria-labelledby="statusTitle">
      <header class="ts-panel__head">
        <h2 id="statusTitle">ステータス</h2>
      </header>
      <div class="ts-panel__body">
        <div class="ts-status">
          <span id="busy" class="ts-spinner" hidden aria-hidden="true"></span>
          <div class="ts-status__main">
            <p id="statusText" class="ts-status__text" aria-live="polite">待機中</p>
            <p id="statusSub" class="ts-muted"></p>
          </div>
        </div>

        <div id="notice" class="ts-notice ts-notice--info" role="status" aria-live="polite">
          <p id="noticeText">ファイルを選択してください。</p>
        </div>

        <div id="uploadWrap" class="ts-progress" hidden>
          <div class="ts-progress__head">
            <span id="uploadLabel">アップロード中…</span>
            <span id="uploadPct" class="ts-progress__pct">0%</span>
          </div>
          <div class="ts-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="uploadBar" class="ts-bar__fill"></div>
          </div>
        </div>

        <div id="jobWrap" class="ts-progress" hidden>
          <div class="ts-progress__head">
            <span id="jobLabel">処理待ち…</span>
            <span id="jobPct" class="ts-progress__pct">0%</span>
          </div>
          <div class="ts-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="jobBar" class="ts-bar__fill"></div>
          </div>
        </div>

        <dl id="metaList" class="ts-meta" hidden></dl>

        <section id="resultWrap" class="ts-result" aria-labelledby="resultTitle" hidden>
          <header class="ts-result__head">
            <h2 id="resultTitle">文字起こし結果</h2>
            <div id="downloads" class="ts-downloads"></div>
          </header>
          <div class="ts-result__body">
            <div class="ts-table-wrap">
              <table class="ts-table">
                <thead>
                  <tr>
                    <th scope="col">開始</th>
                    <th scope="col">終了</th>
                    <th scope="col">テキスト</th>
                  </tr>
                </thead>
                <tbody id="segmentBody"></tbody>
              </table>
            </div>

            <div class="ts-fulltext">
              <div class="ts-fulltext__head">
                <label class="ts-label" for="fullText">全文</label>
                <button id="copyBtn" class="ts-button ts-button--small" type="button">コピー</button>
              </div>
              <textarea id="fullText" class="ts-textarea" rows="10" readonly></textarea>
            </div>
          </div>
        </section>

        <p class="ts-hint">結果はここに表示されます。</p>
      </div>
    </section>
  </div>

  <footer class="ts-footer">
    <span>アップロードされたファイルと生成結果は 12 時間後に自動削除されます。</span>
  </footer>
</main>
<script src="/static/app.js"></script>
</body>
</html>
